[project]
name = "athena-at-home"
version = "0.1.0"
description = "Athena@Home: a home capture system that reads, sorts and keeps family records on home machines"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Sieve worker: DeepSeek-OCR-2 via MLX + Apple Vision tier 0 (Apple Silicon macOS only)
sieve = [
    "mlx-vlm>=0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pillow>=10.0",
    "nats-py[nkeys]>=2.7",
]
# Client for capture stations and services on any platform (Linux included)
client = ["nats-py[nkeys]>=2.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "rapidfuzz>=3"]

[project.scripts]
sieve = "sieve.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: needs nats-server and the DeepSeek-OCR-2 model (slow)"]
