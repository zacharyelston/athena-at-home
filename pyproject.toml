[project]
name = "athena-at-home"
version = "0.1.0"
description = "Athena@Home: capture, OCR, libraries and publishing for family, club and other archives, on their owners' machines"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
# Core modules (capture bundles, and the library and publisher to come)
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
# Sieve worker: DeepSeek-OCR-2 via MLX + Apple Vision tier 0 (Apple Silicon macOS only)
sieve = [
    "mlx-vlm>=0.8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pillow>=10.0",
    "nats-py[nkeys]>=2.7",
]
# Client for capture stations and services on any platform (Linux included)
client = ["nats-py[nkeys]>=2.7"]
# Tests on any platform (CI runs Linux with .[client,dev]); MLX and Apple Vision tests skip where unavailable
dev = ["pytest>=8", "pytest-asyncio>=0.23", "rapidfuzz>=3", "pillow>=10.0", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.scripts]
sieve = "sieve.__main__:main"
athena = "athena.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sieve*", "athena*"]

[tool.setuptools.package-data]
"athena.bundle" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: needs nats-server and the DeepSeek-OCR-2 model (slow; also set SIEVE_E2E=1)",
    "mlx: needs Apple Silicon with mlx-vlm installed (skipped elsewhere)",
    "macos: needs Apple Vision through pyobjc (skipped elsewhere)",
]
